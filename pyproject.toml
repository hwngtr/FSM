[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "npc-stealth"
version = "0.2.0"
description = "Smart NPC Behavior System Using Finite State Machines, Behavior Trees, and Petri Nets (61CSE327 Project 2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
